# DFRobot SEN0623 C1001 mmWave Human Detection Sensor
# https://wiki.dfrobot.com/SKU_SEN0623_C1001_mmWave_Human_Detection_Sensor

esphome:
  name: mmwave_sensor

uart:
  id: uart_bus
  tx_pin: 1
  rx_pin: 3
  baud_rate: 115200

# Main component with all sub-entities
dfrobot_sen0623:
  id: mmwave
  uart_id: uart_bus
  update_interval: 60s

  # Core sensors (both modes)
  heart_rate:
    name: Heart Rate
  breath_rate:
    name: Breath Rate
  human_distance:
    name: Distance
    unit_of_measurement: cm
  human_move_range:
    name: Move Range

  # Binary sensor
  presence:
    name: Presence

  # Text sensors
  status:
    name: Status
  movement:
    name: Movement

# Additional sensors - add under main component when needed:
#  - install_angle_x/y/z: Installation angle
#  - install_height: Installation height
#  - fall_state: Fall detection state
#  - static_residency: Static residency state  
#  - track_x/y: Target tracking coordinates
#  - in_bed: In or out of bed (sleep mode)
#  - sleep_state: Sleep state (0=awake, 1=light, 2=deep)
#  - wake_duration: Wake duration in minutes
#  - light_sleep: Light sleep duration
#  - deep_sleep: Deep sleep duration
#  - sleep_quality: Sleep quality score
#  - sleep_disturbances: Sleep disturbances count
#  - breathe_state: Breathing state (1=normal, 2=fast, 3=slow, 4=none)

# Switches (typed schema)
switch:
  - platform: dfrobot_sen0623
    type: request_rate
    name: Request Rate
  - platform: dfrobot_sen0623
    type: hp_led
    name: HP LED

# Buttons (typed schema)
button:
  - platform: dfrobot_sen0623
    type: reset
    name: Reset Sensor
  - platform: dfrobot_sen0623
    type: mode_fall
    name: Fall Mode
  - platform: dfrobot_sen0623
    type: mode_sleep
    name: Sleep Mode